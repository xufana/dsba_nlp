name: pages

on:
  push:
    branches: [autumn-2026, ADD-2026]
    paths:
      - "week*/demo/week*_demo.html"
      - "week*/demo/week*_check_yourself.html"
      - "week*/demo/week*_lecture.html"
      - "week*/demo/week*_add.html"
      - "week*/README.md"
      - "week04_practice/*.ipynb"
      - "week04_practice/practice_data.json"
      - "scripts/build_site.py"
      - "scripts/build_add_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: autumn-2026
          path: autumn
      - name: Проверить наличие ADD-2026
        id: add
        shell: bash
        run: |
          refs=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/ADD-2026)
          if [ -n "$refs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.add.outputs.exists == 'true'
        with:
          ref: ADD-2026
          path: add
      - name: Собрать оба курса
        if: steps.add.outputs.exists == 'true'
        run: python3 add/scripts/build_add_site.py _site --autumn-source autumn
      - name: Собрать autumn-2026
        if: steps.add.outputs.exists != 'true'
        run: python3 autumn/scripts/build_site.py _site autumn-2026
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
