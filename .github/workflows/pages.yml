name: pages

# Publishes the built week demos (week*/demo/week*_demo.html), the check-yourself
# appendices (week*/demo/week*_check_yourself.html) and an index page.
# The demos are committed already built; this only copies them.
on:
  push:
    branches: [autumn-2026]
    paths:
      - "week*/demo/week*_demo.html"
      - "week*/demo/week*_check_yourself.html"
      - "week*/README.md"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build_site.py _site "${GITHUB_REF_NAME}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
