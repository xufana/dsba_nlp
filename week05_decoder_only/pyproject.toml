[project]
name = "nlp-dsba-week05"
version = "0.1.0"
description = "Week 5 — the decoder alone: GPT and where the task lives. Self-contained seminar environment (weeks 1 and 4 are read from ../)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "torch>=2.2",
    "tokenizers>=0.20",
    "transformers[torch]>=5.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "datasets>=5.0.1",
    "accelerate>=1.1.0",
    "seqeval>=1.2.2",
]

[tool.uv]
package = false
