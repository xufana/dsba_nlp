<title>Representation × Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root {
  color-scheme: light;
  --ground:        #f7f6f2;
  --panel:         #fdfdfc;
  --panel-sunk:    #f1efe9;
  --ink:           #14161a;
  --ink-2:         #55595f;
  --ink-3:         #8b8e92;
  --rule:          #dcdad3;
  --rule-strong:   #bab7ad;
  --cls-0: #2a78d6; --cls-1: #eb6834; --cls-2: #1baf7a; --cls-3: #4a3aa7;
  --good:  #0ca30c; --bad: #d03b3b;
  --seq-1: #5598e7; --seq-2: #3987e5; --seq-3: #2a78d6; --seq-4: #256abf; --seq-5: #104281;
  --shadow: 0 1px 2px rgba(20,22,26,.05), 0 8px 24px -16px rgba(20,22,26,.28);

  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #131413;
    --panel:       #1b1c1b;
    --panel-sunk:  #232422;
    --ink:         #f0efe9;
    --ink-2:       #a8a79f;
    --ink-3:       #7b7a73;
    --rule:        #31322e;
    --rule-strong: #4c4d47;
    --cls-0: #3987e5; --cls-1: #d95926; --cls-2: #199e70; --cls-3: #9085e9;
    --good: #0ca30c; --bad: #d03b3b;
    --seq-1: #2a78d6; --seq-2: #3987e5; --seq-3: #5598e7; --seq-4: #6da7ec; --seq-5: #9ec5f4;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #131413;
  --panel:       #1b1c1b;
  --panel-sunk:  #232422;
  --ink:         #f0efe9;
  --ink-2:       #a8a79f;
  --ink-3:       #7b7a73;
  --rule:        #31322e;
  --rule-strong: #4c4d47;
  --cls-0: #3987e5; --cls-1: #d95926; --cls-2: #199e70; --cls-3: #9085e9;
  --good: #0ca30c; --bad: #d03b3b;
  --seq-1: #2a78d6; --seq-2: #3987e5; --seq-3: #5598e7; --seq-4: #6da7ec; --seq-5: #9ec5f4;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 20.1px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: 278px minmax(0, 1fr); gap: 0; }
.rail {
  position: sticky; top: 0; align-self: start; height: 100vh;
  border-right: 1px solid var(--rule);
  padding: 26px 18px 18px 26px;
  display: flex; flex-direction: column; gap: 18px;
  overflow-y: auto;
}
.rail-mark {
  font-family: var(--mono); font-size: 14px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3);
}
.rail-eq { font-family: var(--display); font-size: 17.7px; font-weight: 700; line-height: 1.3; }
.rail nav { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
.rail nav a {
  display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline;
  padding: 4px 6px 4px 0; text-decoration: none; color: var(--ink-2);
  font-family: var(--display); font-size: 16.4px; line-height: 1.32;
  border-radius: 3px;
}
.rail nav a span:first-child {
  font-family: var(--mono); font-size: 13.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.rail nav a:hover { color: var(--ink); background: var(--panel-sunk); }
.rail nav a.on { color: var(--ink); font-weight: 700; }
.rail nav a.on span:first-child { color: var(--ink); }
.rail-foot { margin-top: auto; font-family: var(--mono); font-size: 13.5px; color: var(--ink-3); line-height: 1.6; }
.rail-btns { display: flex; gap: 6px; flex-wrap: wrap; }

main { padding: 0 0 140px; min-width: 0; }
.wrap { max-width: 1160px; padding: 0 48px; margin: 0 auto; }
section { padding: 64px 0 8px; scroll-margin-top: 20px; }
.prose { max-width: none; }
.prose p { margin: 0 0 1.05em; }
.prose p + p { margin-top: -.15em; }

/* --------------------------------------------------------------- type */
h1 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(41px, 6.04vw, 72.9px); line-height: .98; letter-spacing: -.025em;
  margin: 0 0 22px; text-wrap: balance;
}
h2 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(27.5px, 3.19vw, 37.8px); line-height: 1.08; letter-spacing: -.018em;
  margin: 0 0 14px; text-wrap: balance;
}
h3 {
  font-family: var(--display); font-weight: 700; font-size: 20.6px;
  letter-spacing: -.008em; margin: 34px 0 10px;
}
.eyebrow {
  font-family: var(--mono); font-size: 14px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px;
}
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.lede { font-size: 23.5px; line-height: 1.52; color: var(--ink-2); max-width: none; }
.prose strong { font-weight: 600; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.prose code { background: var(--panel-sunk); padding: .1em .34em; border-radius: 3px; }
a { color: inherit; text-underline-offset: 2px; text-decoration-color: var(--rule-strong); }

/* -------------------------------------------------------------- panels */
.panel {
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: 4px; box-shadow: var(--shadow);
  margin: 22px 0 26px; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 11px 16px; border-bottom: 1px solid var(--rule);
  background: var(--panel-sunk);
  font-family: var(--mono); font-size: 14px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-2); flex-wrap: wrap;
}
.panel-body { padding: 18px 16px; }
.panel-body.tight { padding: 12px 16px; }
.panel-note {
  padding: 12px 16px; border-top: 1px solid var(--rule); background: var(--panel-sunk);
  font-size: 17.7px; color: var(--ink-2); line-height: 1.55;
}
.scroll-x { overflow-x: auto; }

/* ------------------------------------------------------------- controls */
button, .btn {
  font-family: var(--display); font-size: 16.4px; font-weight: 500;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: 3px;
  padding: 6px 12px; cursor: pointer; line-height: 1.35;
  transition: background .12s ease, border-color .12s ease;
}
button:hover { background: var(--panel-sunk); border-color: var(--ink-3); }
button[disabled] { opacity: .42; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }
button.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
button.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.btnrow { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
input[type="text"], textarea, select {
  font-family: var(--mono); font-size: 16.4px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 8px 10px;
  width: 100%;
}
input[type="range"] { accent-color: var(--ink); width: 100%; }
label.field { display: block; font-family: var(--mono); font-size: 14px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }

/* ---------------------------------------------------------------- data */
table { border-collapse: collapse; width: 100%; font-size: 16.4px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
th { font-family: var(--mono); font-size: 13.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--mono); font-size: 15.4px; }
th.data-th { text-transform: none; letter-spacing: 0; font-size: 14.5px; color: var(--ink-2); }
tr:last-child td { border-bottom: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 14.5px; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 2px; border: 1px solid var(--rule-strong);
  white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.c0 { background: var(--cls-0); } .c1 { background: var(--cls-1); }
.c2 { background: var(--cls-2); } .c3 { background: var(--cls-3); }
.t0 { color: var(--cls-0); } .t1 { color: var(--cls-1); }
.t2 { color: var(--cls-2); } .t3 { color: var(--cls-3); }

.stat-row { display: flex; gap: 34px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 32.5px;
  line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { font-family: var(--mono); font-size: 13.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); }

.reveal-wrap { position: relative; }
.veil {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 26px 16px; background: var(--panel-sunk);
  border: 1px dashed var(--rule-strong); border-radius: 3px;
  font-family: var(--mono); font-size: 15.4px; color: var(--ink-2);
  text-align: center; flex-wrap: wrap;
}
[hidden] { display: none !important; }

.tok {
  display: inline-block; font-family: var(--mono); font-size: 15.4px;
  padding: 1px 6px; margin: 2px 3px 2px 0; border-radius: 2px;
  background: var(--panel-sunk); border: 1px solid var(--rule);
}
.tok.diff { border-color: var(--ink-3); background: var(--panel); font-weight: 500; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }

svg { display: block; max-width: 100%; }
svg text { font-family: var(--mono); fill: var(--ink-2); }
.axis line, .axis path { stroke: var(--rule); }
.gridline { stroke: var(--rule); stroke-dasharray: 2 3; }

.tooltip {
  position: fixed; pointer-events: none; z-index: 50; opacity: 0;
  background: var(--panel); border: 1px solid var(--rule-strong);
  border-radius: 3px; box-shadow: var(--shadow); padding: 7px 10px;
  font-family: var(--mono); font-size: 14.5px; line-height: 1.5; color: var(--ink);
  transition: opacity .1s ease; max-width: 280px;
}

.footnote { font-size: 17.2px; color: var(--ink-2); max-width: none; }

/* library pointers: a quiet line of names, with the actual call one click away */
.codenote { margin: 16px 0 0; border-top: 1px solid var(--rule); padding-top: 9px; }
.codenote > summary {
  cursor: pointer; list-style: none; display: flex; gap: 9px;
  align-items: baseline; flex-wrap: wrap; padding: 2px 0;
}
.codenote > summary::-webkit-details-marker { display: none; }
.codenote > summary::before {
  content: "+"; font-family: var(--mono); font-size: 15px; color: var(--ink-3);
  width: 9px; flex: none;
}
.codenote[open] > summary::before { content: "−"; }
.codenote > summary:hover .libs, .codenote[open] > summary .libs { color: var(--ink); }
.codenote .k {
  font-family: var(--mono); font-size: 13px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); flex: none;
}
.codenote .libs {
  font-family: var(--mono); font-size: 15px; line-height: 1.55; color: var(--ink-2);
  transition: color .12s ease;
}
.codenote pre {
  margin: 11px 0 0; padding: 13px 15px; background: var(--panel-sunk);
  border-radius: 3px; font-family: var(--mono); font-size: 15.4px; line-height: 1.8;
  white-space: pre-wrap; word-break: break-word; color: var(--ink);
}
.codenote .why { font-size: 16.4px; color: var(--ink-2); line-height: 1.55; margin-top: 10px; }
.codenote .why code { font-family: var(--mono); font-size: 15.4px; }
.kbd {
  font-family: var(--mono); font-size: 14px; border: 1px solid var(--rule-strong);
  border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; color: var(--ink-2);
}

/* --------------------------------------------------- presentation mode */
body.present .prose:not(.keep) { display: none; }
body.present .footnote { display: none; }
body.present section { min-height: 100vh; padding-top: 40px; }
body.present .panel { margin-top: 14px; }
body.present .lede { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: none;
    border-bottom: 1px solid var(--rule); padding: 18px 20px; }
  .rail nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .wrap { padding: 0 20px; }
  body { font-size: 18.6px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
